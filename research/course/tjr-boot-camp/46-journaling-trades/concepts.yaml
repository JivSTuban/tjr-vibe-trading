- name: Trade-journal schema
  teacher_definition: "Cover everything that could affect the trade. In columns: pair, session, confluences, risk — then write out your full thoughts, whether you followed your plan, emotions, and how you can improve."
  source_timestamp: "00:53"
  codex_interpretation: "Structured per-trade record: instrument, session, confluences[], htf_context, risk_pct, plan_followed, emotions[], improvements[], outcome. Backbone of the self-improving journal loop."
  confidence: high
  requires_confirmation: false

- name: Risk 1-3% per trade (target 1%)
  teacher_definition: "Ideally it's 1 to 3%. If it's anything more, you're immediately doing something wrong. If it's anything less, that's completely fine. Ideally just 1% per trade — or a set calculated lot size."
  source_timestamp: "04:36"
  codex_interpretation: "Risk-engine constraint: per-trade risk in [1%,3%], default 1%; risk >3% is a hard violation. Direct position-sizing input."
  confidence: high
  requires_confirmation: false

- name: Session filter (NY / London, not Asian)
  teacher_definition: "Ideally you're trading New York session or London session and not Asian session. Wake up early and trade New York, or stay up late and trade London — the most optimal time, most volatility and volume."
  source_timestamp: "03:12"
  codex_interpretation: "Session gate: permit entries only during New York or London sessions; exclude Asian by default. Needs exact session clock/timezone."
  confidence: high
  requires_confirmation: true

- name: One-instrument focus while unprofitable
  teacher_definition: "Ideally you're only trading one pair because you're not profitable yet. Go on your watch list and delete every single one and just have one pair; get really good at that pair."
  source_timestamp: "02:08"
  codex_interpretation: "Watchlist constraint for the learning phase: restrict to a single instrument to reduce variables. Not a permanent portfolio rule."
  confidence: medium
  requires_confirmation: true

- name: Confirmation ladder (sweep+BOS vs. sweep+BOS+OB/FVG entry)
  teacher_definition: "Last week I was only taking liquidity sweep + break of structure and lost every trade. This week I waited for a liquidity sweep + break of structure + order block entry / fair value gap entry to give me more confluence, more confirmation — that avoided a loss and made money."
  source_timestamp: "09:34"
  codex_interpretation: "Entry-quality upgrade: liquidity sweep + BOS alone is insufficient; require a subsequent order-block or FVG entry/reaction as added confirmation before entry."
  confidence: high
  requires_confirmation: false

- name: Log emotion + cause
  teacher_definition: "Write what emotions you felt and then why you felt them — scared to enter, overconfident, greedy (extended TP instead of taking profit at reaction areas), fearful from low confidence, over-risked."
  source_timestamp: "06:55"
  codex_interpretation: "Emotional-state field with causal note; used to precondition future behavior (e.g. greed signal -> prompt to take profit at reaction level). Behavioral guardrail data."
  confidence: medium
  requires_confirmation: true

- name: Plan-adherence field
  teacher_definition: "Did you follow your plan? Write yes/no and why. If you didn't follow your plan, write what you didn't follow — and odds are you lost."
  source_timestamp: "06:12"
  codex_interpretation: "Boolean plan_followed + deviation list per trade; correlate deviations with losses to reinforce adherence."
  confidence: high
  requires_confirmation: false
