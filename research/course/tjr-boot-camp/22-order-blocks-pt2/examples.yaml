- timestamp: "20:42"
  instrument: unstated
  timeframe: 4h -> 15m
  direction: long (bullish OB)
  setup_components:
    - 4h BOS to upside; leg down that caused the move up = OB
    - monitor highs on 15m for a BOS to enter — "boom nothing, boom we get a break of structure"
    - long off candle close; stop under structure
    - target sequence of previous liquidity + FVG within range — "everything gets hit"
  stated_outcome: illustrative; all targets ("previous areas of liquidity") get hit; no numeric R
  suitable_for_dataset: false

- timestamp: "22:45"
  instrument: unstated
  timeframe: HTF -> 15m
  direction: short (bearish OB)
  setup_components:
    - liquidity sweep, BOS down on the candle
    - price pushes up into OB range; scale down to 15m; BOS down on 15m = entry
    - short; stop either above the entry candle or above the OB itself (play safe)
    - target previous areas of liquidity — repeatedly "gets hit"
  stated_outcome: illustrative short; multiple liquidity targets get hit; no numeric R
  suitable_for_dataset: false
