- id: tjr-order-blocks-pt2-r01
  teacher_statement: >-
    "Order blocks are the move prior to the liquidity sweep / the move that
    causes the liquidity sweep, and prior to the break of structure... it's the
    whole move." (01:33, 07:03, 22:23)
  source_timestamp: "01:33"
  proposed_machine_rule: >-
    Define OB zone as the price range of the contiguous impulsive leg
    immediately preceding the BOS/MSS that flips local trend. Bullish OB =
    [low, high] of the last down-leg before an up-BOS; bearish OB = [low, high]
    of the last up-leg before a down-BOS. Store the leg (not a single candle)
    and the detection timeframe.
  status: proposed
  ambiguity: >-
    TJR alternates between "this candle" and "the entire move" for the OB
    boundary; exact leg-start rule (from prior swing? from displacement start?)
    is undefined.
  counterexamples: []

- id: tjr-order-blocks-pt2-r02
  teacher_statement: >-
    "Understand what timeframe you're playing off of... if you keep your stop
    loss super tight you're gonna get stopped out... this was a four hour move,
    so you're gonna have to put your stop all the way up here." (08:12-09:56)
  source_timestamp: "08:12"
  proposed_machine_rule: >-
    Enforce timeframe coherence: the stop-loss reference must be the same
    timeframe on which the OB/BOS was detected (SL_reference_TF ==
    OB_detection_TF). For a HTF OB, place SL beyond the HTF OB boundary even
    when the entry-confirmation is on a lower TF. Reject/flag any setup whose
    SL is sized only to the LTF entry structure while the OB is HTF.
  status: proposed
  ambiguity: >-
    No numeric buffer given for "all the way up here"; exact SL offset beyond
    the OB (ticks/pips/ATR) unspecified.
  counterexamples: []

- id: tjr-order-blocks-pt2-r03
  teacher_statement: >-
    "Scale down... identify OB+BOS on the higher timeframe, then scale down to
    1h/15m to get very very precise; wait for price to draw back into the order
    block; enter on a break of structure in the trade direction." (08:29-13:26)
  source_timestamp: "08:29"
  proposed_machine_rule: >-
    Nested multi-TF entry: (1) detect HTF OB + BOS -> set direction + OB zone;
    (2) require price to retrace INTO the OB zone; (3) on the entry TF (e.g.
    15m), require a confirming BOS in the HTF direction (break of the monitored
    swing high for longs / low for shorts); (4) enter on that break's candle
    close. All four conditions must hold in sequence.
  status: proposed
  ambiguity: >-
    Which specific lower TF to use is left to trader discretion ("depends what
    timeframe you're playing off of"); no fixed HTF->LTF mapping.
  counterexamples: []

- id: tjr-order-blocks-pt2-r04
  teacher_statement: >-
    "When is New York session open — 9:30 — mark that off, we're not trading
    pre-market"; "this is right during London session so we're gonna wait for
    London session to open first." (12:53-13:04, 16:20)
  source_timestamp: "12:53"
  proposed_machine_rule: >-
    Session gate: only permit entry triggers after the relevant session open.
    NY open = 9:30 (timezone unstated, assume America/New_York pending
    confirmation). Suppress entries during pre-market. London open time not
    provided numerically — parameterize and confirm.
  status: proposed
  ambiguity: >-
    Timezone for 9:30 not stated; London open time not given; whether the gate
    is per-pair or global unstated.
  counterexamples: []

- id: tjr-order-blocks-pt2-r05
  teacher_statement: >-
    "Target previous areas of liquidity on higher timeframes"; TP2 "within this
    imbalance, fifty percent of it"; TP1/TP3 at successive highs. (09:57,
    13:38-14:22)
  source_timestamp: "09:57"
  proposed_machine_rule: >-
    Build a TP ladder ordered by distance: TP levels = prior HTF liquidity pools
    (swing highs/lows) and FVG/imbalance levels in the trade direction. TP at an
    imbalance = 50% (equilibrium) of that imbalance. Scale toward progressively
    higher-TF liquidity.
  status: proposed
  ambiguity: >-
    Position-size split across TP1/TP2/TP3 not specified; which liquidity pools
    qualify (all prior swings vs only unmitigated) undefined.
  counterexamples: []

- id: tjr-order-blocks-pt2-r06
  teacher_statement: >-
    "If I can't find a good risk reward off of just a liquidity sweep and break
    of structure... why wouldn't I wait for a potentially way better
    risk-reward ratio right here and make a lot more money and be patient."
    (25:15-25:32)
  source_timestamp: "25:15"
  proposed_machine_rule: >-
    Minimum-R:R / patience gate: do not enter on the immediate sweep+BOS if
    projected R:R is below threshold; instead wait for the OB-retracement entry
    that offers higher R:R. Enforce a configurable min-R:R filter and prefer the
    deeper OB-retrace entry when it improves R:R.
  status: proposed
  ambiguity: >-
    No numeric min-R:R threshold given (a 1:12 example is cited as achievable
    but not a floor).
  counterexamples: []
