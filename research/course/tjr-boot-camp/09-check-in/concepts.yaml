- name: Mandatory rest day / anti-burnout
  teacher_definition: "Take a day off, step away from the charts. Give yourself at least one day out of the week to take a break, a mental detox. It's very easy to get burnt out and to over-analyze and psych yourself out."
  source_timestamp: "06:30"
  codex_interpretation: "Behavioral guardrail: enforce >=1 no-trade rest day per week to reduce burnout and over-analysis (a named failure mode)."
  confidence: medium
  requires_confirmation: true

- name: Profitability horizon is post-course / multi-month
  teacher_definition: "Even after the two months you definitely won't be profitable. It's the time you put in after this, what you do with this knowledge, that will turn you profitable."
  source_timestamp: "04:35"
  codex_interpretation: "Evaluate performance over long horizons, not per-session; sets expectation that competence precedes profitability."
  confidence: medium
  requires_confirmation: true

- name: Learn slowly / one concept at a time
  teacher_definition: "I want to take this slow — one day at a time, make sure you actually understand each concept. Like studying for a finals test, you don't cram it all in one day. Liquidity is split into multiple parts because it's the most valuable and essential thing in the strategy."
  source_timestamp: "02:53"
  codex_interpretation: "Curriculum-design note; confirms liquidity is the strategy's core pillar. Not a trading rule."
  confidence: high
  requires_confirmation: false
