- id: tjr-fear-r01
  teacher_statement: >
    "One trade a day while risking one percent a day." Repeated as the standing plan. [06:57],
    [18:24], [04:57]
  source_timestamp: "06:57"
  proposed_machine_rule: >
    Fixed risk = 1% of account per trade; max 1 trade per day. (Reconciles with Day 25's
    '1-2 trades/day' cap -- Fear states 1/day + 1% as the concrete default.)
  status: proposed
  ambiguity: >
    TJR frames these as HIS personal defaults ('for me personally'). Day 25 allowed up to 2
