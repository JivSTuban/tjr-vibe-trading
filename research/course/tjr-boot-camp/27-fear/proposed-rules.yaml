- id: tjr-fear-r03
  teacher_statement: >
    "Start a $100 account and risk 1% / a dollar per trade." Never fund an account with money you
    can't afford to lose (~90% blow the first live account). [10:57], [07:45]
  source_timestamp: "10:57"
  proposed_machine_rule: >
    Begin live at minimal size ($100) at 1% risk; only fund with loss-affordable capital; on a
    blow-up, revert to demo, re-prove profitability, then re-enter live.
  status: proposed
  ambiguity: >
    "$100" and "~90% blow-up" are illustrative/anecdotal, not hard thresholds.
  counterexamples: []

- id: tjr-fear-r04
  teacher_statement: >
    Under $10k affordable capital -> take a funded challenge (pass = ~10% in a month); over $10k
    -> trade own live account. [12:43], [13:19]
  source_timestamp: "12:43"
  proposed_machine_rule: >
    Account-state machine: if affordable capital < $10k route to a funded/prop challenge
    (target ~10%/month to pass) then convert payouts to live; else fund own live account.
  status: proposed
  ambiguity: >
    Prop-firm-specific ($10k threshold, 10%/month target) -- not a market rule; depends on the
    chosen prop firm's ruleset.
  counterexamples: []

- id: tjr-fear-r05
  teacher_statement: >
    "Be robotic with this... trading should be boring... stick to your trading plan." Don't chase
    a new strategy every day. Take every valid setup (fear = skipping valid entries). [18:12],
    [15:39]
  source_timestamp: "18:12"
  proposed_machine_rule: >
    Enforce a single fixed strategy/plan deterministically: take every plan-conformant setup
    within the 1-trade/day, 1%-risk envelope; never skip a valid entry and never substitute a new
    strategy mid-stream.
  status: proposed
  ambiguity: >
    "Valid setup" is defined by the (not-yet-ingested) assembled strategy; this rule is a
    behavioral wrapper, not a standalone entry condition.
  counterexamples: []
