# Psychology lesson: rules here are BEHAVIORAL guardrails for the learner/process,
# not chart-execution rules. Every rule stays status: proposed.

- id: tjr-take-action-r01
  teacher_statement: "There will be an upload every single day and you have to watch it every day. If you miss a day, go back and watch the one you missed and that day's."
  source_timestamp: "03:20"
  proposed_machine_rule: "Course-ingestion cadence: process exactly one lesson per calendar day in order; if a day is skipped, backfill the missed lesson before advancing. No lesson may be skipped — the course is a start-to-finish sequence."
  status: proposed
  ambiguity: "Applies to the learning/ingestion pipeline, not live trading. 'Every day' cadence is TJR's upload promise, not a trading-frequency rule."
