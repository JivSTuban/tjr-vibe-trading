- name: The two-way contract (compliance for content)
  teacher_definition: "This isn't a normal lesson — it's a contract between me and you. I'll put out a video every single day and give you everything for free; all I need in return is your compliance: watch every video, use everything (not bits and pieces), listen and actually DO what I say, and do the homework."
  source_timestamp: "00:47"
  codex_interpretation: "Frames the boot camp as an obligation loop: daily lesson consumption + homework completion is the learner's contractual duty. Sets the discipline baseline the rest of the course assumes."
  confidence: high
  requires_confirmation: false

- name: Take action (Lesson 1 thesis)
  teacher_definition: "Lesson one of the course is: take action. People say 'I wish I could do this' — why don't you? Because you're too scared to take action. Action comes first, the money comes second — money always comes last."
  source_timestamp: "04:21"
  codex_interpretation: "Core psychology thesis of the lesson: bias toward doing over planning/wishing. Non-mechanical; motivational framing for the whole course."
  confidence: high
  requires_confirmation: false

- name: Reject get-rich-quick timeline
  teacher_definition: "You will not get rich in a day, a week, a month, two months, or three months — forget that completely. You can realistically/likely get rich in one to two years, and THAT is quick. This shit took me years."
  source_timestamp: "05:23"
  codex_interpretation: "Sets a realistic profitability horizon of ~1-2 years. Behavioral expectation-setting; use as an anti-overtrading / anti-blow-up prior, not a parameter."
  confidence: high
  requires_confirmation: false

- name: Forget everything / blank slate
  teacher_definition: "Step one: forget every little thing you ever thought you knew about trading. Don't jump ahead asking about fair value or equilibrium — we'll get to it. I'll explain everything at a first/third-grade level."
  source_timestamp: "09:35"
  codex_interpretation: "Instruct learner to discard prior TA priors so the course's liquidity-based framework isn't contaminated. Meta-instruction, not a rule."
  confidence: high
  requires_confirmation: false

- name: Be real with yourself / own your mistakes
  teacher_definition: "Be real with yourself. Admit when you're wrong, understand when you were wrong, and how to improve. My losses were my fault only — I incorrectly read the market. It wasn't the strategy; don't switch strategies over it."
  source_timestamp: "09:19"
  codex_interpretation: "Accountability principle: attribute losses to execution/read, not to the system. Discourages strategy-hopping. Discipline heuristic."
  confidence: high
  requires_confirmation: false

- name: Market experience over gurus (no shortcut)
  teacher_definition: "I'll give you every piece of information you need but that alone won't make you profitable — you have to put the time in on the charts. I learned by removing every indicator, stripping my charts, and just watching the market. That's where I saw the most growth. Nothing can speed up that process."
  source_timestamp: "12:16"
  codex_interpretation: "Screen-time / observation is the irreplaceable input. Implies a naked-chart study practice. Later homework operationalizes this."
  confidence: high
  requires_confirmation: false

- name: Put yourself in a position with zero room for failure
  teacher_definition: "Put yourself in a position where there is literally zero room for failure — like hanging off a cliff, you'll do the muscle-up you couldn't do in the gym. For me that was rock bottom: ~$2,000 in bank debt, DoorDashing, depressed, broke. That desperation is what forced profitability."
  source_timestamp: "25:21"
  codex_interpretation: "Motivational 'burn the boats' framing. Not automatable; context for why he took it seriously."
  confidence: medium
  requires_confirmation: false

- name: Journaling (elevated to a rule)
  teacher_definition: "Journaling — I highly recommend it, in fact let's make it a fucking rule. Journal, note this. I'll journal my own thought process making the course; you journal your market experience."
  source_timestamp: "40:29"
  codex_interpretation: "The one item TJR explicitly calls a 'rule' in this lesson: maintain a daily trading/market-experience journal. Convert to a behavioral guardrail (mandatory journaling per session/day)."
  confidence: high
  requires_confirmation: true

- name: Daily cadence + catch-up
  teacher_definition: "There will be an upload every single day and you have to watch it every day. If you miss a day, go back and watch the one you missed AND that day's. This is meant to be watched start to finish."
  source_timestamp: "03:20"
  codex_interpretation: "Consumption schedule rule: one lesson/day, no gaps, backfill misses. Behavioral guardrail for the course itself."
  confidence: high
  requires_confirmation: false

- name: Delete the time-sink app (reclaim an hour)
  teacher_definition: "This takes about an hour of your day. Check your screen time — TikTok, Instagram, Snapchat. If one adds up to an hour, delete it and change your life this summer. If you can't find an hour, you have no motivation."
  source_timestamp: "16:56"
  codex_interpretation: "Concrete behavioral homework: remove a distracting app to free ~1 hr/day for study. Actionable but personal, not a trading rule."
  confidence: high
  requires_confirmation: false

- name: London fake out (self-discovered liquidity sweep) — origin anecdote
  teacher_definition: "I did NOT learn liquidity sweeps from ICT. I traded GJ and noticed that right when London session opened it would fake out then go the opposite direction. I called it a 'London fake out'. When it took out a high I'd press sell, with a 15-pip stop loss. That was my start to profitability — from market experience."
  source_timestamp: "37:20"
  codex_interpretation: "Proto-version of the liquidity-sweep reversal: fade a London-open sweep of a session high/low on GBPJPY with a fixed 15-pip SL. Historical backstory, NOT the taught system; formalized later (Lesson 08). Do not code from this."
  confidence: medium
  requires_confirmation: true

- name: Be different / confidence (not cocky)
  teacher_definition: "You can't do this without a different mindset. Stop being afraid, stop being self-conscious, be confident. 'I ain't cocky, it's just confidence.' To be like me your first step is acting like it — the money comes second."
  source_timestamp: "29:58"
  codex_interpretation: "Identity/mindset framing. Motivational, non-mechanical."
  confidence: medium
  requires_confirmation: false
