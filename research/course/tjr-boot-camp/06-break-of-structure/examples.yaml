# Chart examples TJR walks. These are STRUCTURAL/drawn illustrations, not trade tickets:
# no entries, stops, targets, RR, or prices are stated. suitable_for_dataset flags whether
# the example is concrete enough to mine as a labeled BOS/not-BOS instance.

- timestamp: "03:26"
  instrument: unspecified (drawn/illustrative chart, blue/black theme)
  timeframe: unspecified (later zooms to 4H)
  direction: n/a (swing-point identification)
  setup_components:
    - "Odd-looking high that beginners would mismark"
    - "Move up then move down = a high; take the highest wick of the two candles"
    - "4H zoom confirms true low is the extreme wick, not the candle open"
  stated_outcome: "Teaches the 2-candle high/low definition and wick-extreme rule."
  suitable_for_dataset: false

- timestamp: "08:39"
  instrument: unspecified (drawn example)
  timeframe: unspecified
  direction: bearish (down-BOS)
  setup_components:
    - "Prior miniature uptrend, most-recent low identified"
    - "Candle body closes below the most-recent low"
  stated_outcome: "Body close below the low starts a downtrend (lower high, lower low)."
  suitable_for_dataset: false

- timestamp: "10:03"
  instrument: unspecified (drawn example, 'two perfect examples')
  timeframe: unspecified
  direction: bearish then bullish
  setup_components:
    - "Previously trending up; body of candle closes below a low -> trend shifts down (down-BOS)"
    - "Then in the downtrend, a candle closes above the most-recent high -> up-BOS"
    - "Retracement down, then higher high / higher low continuation"
  stated_outcome: "Illustrates both a down-BOS and a subsequent up-BOS with continuation."
  suitable_for_dataset: false

- timestamp: "12:11"
  instrument: unspecified (drawn 'prime time' counterexample)
  timeframe: unspecified
  direction: bullish (fake)
  setup_components:
    - "Wick makes a higher high than a prior high"
    - "Body does NOT close above the high"
  stated_outcome: "NOT a break of structure — wick-through without body close. Price falls."
  suitable_for_dataset: true

