- timestamp: "20:37"
  instrument: unspecified (checklist walkthrough)
  timeframe: daily (implied)
  direction: bearish trend, awaiting up-BOS
  setup_components:
    - "Downtrend identified (lower lows, lower highs)"
    - "Watching the most-recent high; forming wick/candle is not yet a high"
    - "Turns to uptrend only on a candle close above the most-recent high"
  stated_outcome: "Demonstrates the step-by-step checklist and 'wait for the daily close above' logic."
  suitable_for_dataset: false

- timestamp: "22:51"
  instrument: GBPUSD ("GU")
  timeframe: daily (with weekly context)
  direction: bearish (down-BOS on daily)
  setup_components:
    - "Move down then move up = low; candle closes below that low on the daily -> market runs down"
    - "Weekly still bullish -> daily BOS treated as a retracement, not a reversal"
  stated_outcome: "Real daily down-BOS, but subordinate to a bullish weekly (retracement)."
  suitable_for_dataset: true

- timestamp: "23:22"
