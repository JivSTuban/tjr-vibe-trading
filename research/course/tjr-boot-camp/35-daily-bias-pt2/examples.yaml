examples:
  - id: sp500-bias
    instrument: "S&P 500 (ES)"
    type: bias_walkthrough
    source_timestamps: ["01:16", "04:06", "04:09", "04:11", "04:15", "12:58", "14:21"]
    weekly: "bullish / overall up; breaking structure to upside on weekly, about to break monthly structure up"
    daily: "broke structure to downside earlier (why he shorted yesterday), then recently closed back above -> broke structure back to upside -> bullish again"
    conflict_note: "Fundamentals looked bearish and he was surprised by the bullishness [01:16][02:43]; refused to force the bearish view."
    final_bias: bullish
    plan: "Look for longs; 'longs on the S&P will be money.' Execute via 5m/1m building blocks (sweep -> BOS on 5m -> OB entry with BOS on 1m -> long)."
    outcome: "not shown in this video (trade recap promised in a later upload)"

  - id: sp500-execution-detail
    instrument: "S&P 500 (ES)"
    type: entry_model
    source_timestamps: ["10:46", "11:01", "11:34", "12:31", "12:35", "12:38", "13:10"]
    setup: "1h lows as liquidity; 15m order block (whole move down) + imbalance; all TFs (15m,1h,4h,D,W) in uptrend"
    trigger: "price fills imbalance / sweeps lows -> break of structure to upside on 5m -> order block entry with BOS on 1m"
    direction: long
    note: "TJR won't box every level ('too many boxes') but treats the whole zone as high-confluence long area."

  - id: gold-bias
