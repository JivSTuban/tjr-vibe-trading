    plan: "Wants a short; wait for liquidity above highs to be swept + imbalance filled, then scale down to LTF building blocks (sweep -> 15m BOS -> hourly/4h-type trade)."
    uncertainty: "Unsure price will rally high enough into premium to offer the short [14:26][14:27]."
    outcome: "not shown in this video"

